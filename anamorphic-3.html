const D = CONFIG.VIEW_DISTANCE;
const CY = CONFIG.ART_CENTER_Y;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const $ = s => document.querySelector(s);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function makeDemoArt() {
  const W = 800, H = 1000;

  const g = c.getContext('2d');
  const shape = (col, fn) => { g.fillStyle = col; g.beginPath(); fn(); g.fill(); };
  const hair = (col, dx) => {
    shape(col, () => g.ellipse(400 + dx, 400, 285, 365, 0, 0, Math.PI * 2));
    shape(col, () => { g.moveTo(130 + dx, 450); g.bezierCurveTo(80 + dx, 650, 130 + dx, 850, 230 + dx, 975); g.lineTo(340 + dx, 900); g.lineTo(300 + dx, 520); g.closePath(); });
    shape(col, () => { g.moveTo(670 + dx, 450); g.bezierCurveTo(720 + dx, 650, 670 + dx, 850, 570 + dx, 975); g.lineTo(460 + dx, 900); g.lineTo(500 + dx, 520); g.closePath(); });

  hair('#24101f', 118); hair('#6f1d2f', 88); hair('#c8323c', 60); hair('#e4793b', 34); hair('#f2b134', 10);

  shape('#e9a47f', face);
  g.save(); g.beginPath(); face(); g.clip();
  shape('#f5cba9', () => g.ellipse(432, 470, 176, 275, 0, 0, Math.PI * 2));
  shape('#e9a47f', () => g.ellipse(612, 470, 36, 260, 0, 0, Math.PI * 2));

  g.restore();
  // poni
  shape('#e4793b', () => { g.moveTo(205, 440); g.bezierCurveTo(200, 260, 330, 170, 430, 170); g.bezierCurveTo(540, 170, 610, 260, 595, 440); g.bezierCurveTo(560, 330, 470, 290, 380, 270); g.bezierCurveTo(300, 300, 240, 360, 205, 440); g.closePath(); });
  shape('#f2b134', () => { g.moveTo(250, 335); g.quadraticCurveTo(380, 225, 545, 272); g.quadraticCurveTo(400, 262, 262, 358); g.closePath(); });
  // mata
  for (const cx of [320, 480]) {
    const y = 470;
    shape('#d9805f', () => { g.moveTo(cx - 64, y - 6); g.quadraticCurveTo(cx, y - 66, cx + 64, y - 6); g.quadraticCurveTo(cx, y - 44, cx - 64, y - 6); g.closePath(); });
    const eye = () => { g.moveTo(cx - 55, y); g.quadraticCurveTo(cx, y - 42, cx + 55, y); g.quadraticCurveTo(cx, y + 34, cx - 55, y); g.closePath(); };
    shape('#fff3e6', eye);
    g.save(); g.beginPath(); eye(); g.clip();

/* ───────────── Analisis gambar → lapisan warna ───────────── */
function analyse(source, cfg) {
  const sw = source.naturalWidth || source.width, sh = source.naturalHeight || source.height;
  const sc = Math.min(1, cfg.RES / Math.max(sw, sh));
  const w0 = Math.max(16, Math.round(sw * sc)), h0 = Math.max(16, Math.round(sh * sc));
  const cv = document.createElement('canvas'); cv.width = w0; cv.height = h0;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.drawImage(source, 0, 0, w0, h0);
  const px = cx.getImageData(0, 0, w0, h0).data;       // melempar error bila canvas "tainted" (file://)
  const N0 = w0 * h0;
  const valid0 = new Uint8Array(N0);
  let allValid = true;
  for (let i = 0; i < N0; i++) { valid0[i] = px[i * 4 + 3] > 128 ? 1 : 0; if (!valid0[i]) allValid = false; }

  // buang latar polos / latar kotak-kotak transparansi (flood-fill dari tepi)
  let bgRemoved = false;
  if (cfg.BG_REMOVE !== 'none' && allValid) {
    const cs = [0, w0 - 1, (h0 - 1) * w0, N0 - 1].map(i => [px[i * 4], px[i * 4 + 1], px[i * 4 + 2]]);
    const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
    // abu/putih terang tanpa warna → ciri latar kotak-kotak "transparan" yang ikut tersimpan di JPG/PNG
    const lightNeutral = (r, g, b) => Math.min(r, g, b) > 205 && Math.max(r, g, b) - Math.min(r, g, b) < 16;
    const cornersLN = cs.every(c => lightNeutral(c[0], c[1], c[2]));
    const cornersSolid = cs.every(c => dist(c, cs[0]) < cfg.BG_TOLERANCE);
    if (cornersLN || cornersSolid) {
      const bg = [0, 1, 2].map(k => cs.reduce((s, c) => s + c[k], 0) / 4);
      const isBg = i => cornersLN
        ? lightNeutral(px[i * 4], px[i * 4 + 1], px[i * 4 + 2])
        : dist([px[i * 4], px[i * 4 + 1], px[i * 4 + 2]], bg) < cfg.BG_TOLERANCE;
      const seen = new Uint8Array(N0), stack = new Int32Array(N0); let sp = 0;
      const tryPush = (x, y) => {
        if (x < 0 || y < 0 || x >= w0 || y >= h0) return;
        const i = y * w0 + x; if (seen[i]) return;
        if (isBg(i)) { seen[i] = 1; stack[sp++] = i; }
      };
      for (let x = 0; x < w0; x++) { tryPush(x, 0); tryPush(x, h0 - 1); }
      for (let y = 0; y < h0; y++) { tryPush(0, y); tryPush(w0 - 1, y); }
      bgRemoved = true;
      while (sp) {
        const i = stack[--sp]; valid0[i] = 0;
        const x = i % w0, y = (i / w0) | 0;
        tryPush(x + 1, y); tryPush(x - 1, y); tryPush(x, y + 1); tryPush(x, y - 1);
      }
    }
  }

  if (!allValid) bgRemoved = true;
  // kikis tepi 1–2 piksel: membuang "halo" campuran warna latar & tepi gambar
  if (bgRemoved && cfg.BG_ERODE > 0) {
    for (let it = 0; it < cfg.BG_ERODE; it++) {
      const prev = valid0.slice();
      for (let y = 0; y < h0; y++) for (let x = 0; x < w0; x++) {
        const i = y * w0 + x; if (!prev[i]) continue;
        if (x === 0 || y === 0 || x === w0 - 1 || y === h0 - 1 || !prev[i - 1] || !prev[i + 1] || !prev[i - w0] || !prev[i + w0]) valid0[i] = 0;
      }
    }
  }

  // potong sesuai bounding box
  let x0 = w0, y0 = h0, x1 = -1, y1 = -1;
  for (let y = 0; y < h0; y++) for (let x = 0; x < w0; x++) if (valid0[y * w0 + x]) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) throw new Error('Gambar kosong / seluruhnya transparan.');
  const w = x1 - x0 + 1, h = y1 - y0 + 1, N = w * h;
  const rgb = new Uint8ClampedArray(N * 3), val = new Uint8Array(N);
  let validCount = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const s = (y + y0) * w0 + (x + x0), d = y * w + x;
    val[d] = valid0[s]; if (val[d]) validCount++;
    rgb[d * 3] = px[s * 4]; rgb[d * 3 + 1] = px[s * 4 + 1]; rgb[d * 3 + 2] = px[s * 4 + 2];
  }

  // k-means++ pada warna
  const K0 = clamp(Math.round(cfg.LAYERS), 2, 16);
  const rnd = mulberry32(7);
  const step = Math.max(1, Math.floor(validCount / 30000));
  const samp = []; let cnt = 0;
  for (let i = 0; i < N; i++) if (val[i]) { if (cnt++ % step === 0) samp.push(i); }
  const S = samp.length;
  const sd = new Float32Array(S * 3);
  samp.forEach((i, k) => { sd[k * 3] = rgb[i * 3]; sd[k * 3 + 1] = rgb[i * 3 + 1]; sd[k * 3 + 2] = rgb[i * 3 + 2]; });
  const cen = [];
  const first = (rnd() * S) | 0; cen.push([sd[first * 3], sd[first * 3 + 1], sd[first * 3 + 2]]);
  const minD = new Float32Array(S).fill(Infinity);
  while (cen.length < K0) {
    const c = cen[cen.length - 1]; let total = 0;
    for (let k = 0; k < S; k++) {
      const d = (sd[k * 3] - c[0]) ** 2 + (sd[k * 3 + 1] - c[1]) ** 2 + (sd[k * 3 + 2] - c[2]) ** 2;
      if (d < minD[k]) minD[k] = d; total += minD[k];
    }
    if (total < 1) break;
    let r = rnd() * total, pick = S - 1;
    for (let k = 0; k < S; k++) { r -= minD[k]; if (r <= 0) { pick = k; break; } }
    cen.push([sd[pick * 3], sd[pick * 3 + 1], sd[pick * 3 + 2]]);
  }
  const nearest = (r, g, b, cs) => { let best = 0, bd = Infinity; for (let c = 0; c < cs.length; c++) { const d = (r - cs[c][0]) ** 2 + (g - cs[c][1]) ** 2 + (b - cs[c][2]) ** 2; if (d < bd) { bd = d; best = c; } } return best; };
  for (let it = 0; it < 14; it++) {
    const sum = cen.map(() => [0, 0, 0, 0]);
    for (let k = 0; k < S; k++) { const c = nearest(sd[k * 3], sd[k * 3 + 1], sd[k * 3 + 2], cen); const s = sum[c]; s[0] += sd[k * 3]; s[1] += sd[k * 3 + 1]; s[2] += sd[k * 3 + 2]; s[3]++; }
    sum.forEach((s, c) => { if (s[3]) cen[c] = [s[0] / s[3], s[1] / s[3], s[2] / s[3]]; });
  }
  // beri label ke semua piksel; buang cluster yang terlalu kecil
  let labels = new Uint8Array(N).fill(255);
  const assign = cs => { for (let i = 0; i < N; i++) if (val[i]) labels[i] = nearest(rgb[i * 3], rgb[i * 3 + 1], rgb[i * 3 + 2], cs); };
  assign(cen);
  const area0 = new Array(cen.length).fill(0);
  for (let i = 0; i < N; i++) if (val[i]) area0[labels[i]]++;
  const alive = cen.filter((_, c) => area0[c] >= validCount * 0.0025);
  assign(alive.length ? alive : cen);
  const K = (alive.length ? alive : cen).length;

  // penghalusan (filter modus 3×3)
  const cntv = new Uint8Array(K + 1);
  for (let pass = 0; pass < cfg.SMOOTH; pass++) {
    const out = labels.slice();
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x; if (!val[i]) continue;
      cntv.fill(0);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const l = labels[i + dy * w + dx]; if (l !== 255) cntv[l]++; }
      let best = labels[i], bc = cntv[best];
      for (let l = 0; l < K; l++) if (cntv[l] > bc) { bc = cntv[l]; best = l; }
      out[i] = best;
    }
    labels = out;
  }

  // warna rata-rata & luas tiap lapisan
  const sums = Array.from({ length: K }, () => [0, 0, 0, 0]);
  for (let i = 0; i < N; i++) { const l = labels[i]; if (l === 255) continue; const s = sums[l]; s[0] += rgb[i * 3]; s[1] += rgb[i * 3 + 1]; s[2] += rgb[i * 3 + 2]; s[3]++; }
  const means = sums.map(s => s[3] ? [s[0] / s[3], s[1] / s[3], s[2] / s[3]] : [128, 128, 128]);
  const areas = sums.map(s => s[3]);
  return { w, h, labels, rgb, val, K, means, areas };
}

function dilateMask(m, w, h, r) {
  let a = m, b = new Uint8Array(m.length);
  for (let it = 0; it < r; it++) {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = y * w + x; let v = a[i]; if (x > 0 && a[i - 1] > v) v = a[i - 1]; if (x < w - 1 && a[i + 1] > v) v = a[i + 1]; b[i] = v; }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = y * w + x; let v = b[i]; if (y > 0 && b[i - w] > v) v = b[i - w]; if (y < h - 1 && b[i + w] > v) v = b[i + w]; a[i] = v; }
  }
  return a;
}
function blurMask(m, w, h) {
  const o = new Uint8Array(m.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, c = 0;
    for (let dy = -1; dy <= 1; dy++) { const yy = y + dy; if (yy < 0 || yy >= h) continue; for (let dx = -1; dx <= 1; dx++) { const xx = x + dx; if (xx < 0 || xx >= w) continue; s += m[yy * w + xx]; c++; } }
    o[y * w + x] = s / c;
  }
  return o;
}

function buildArtwork(source) {
  const data = analyse(source, CONFIG);
  const { w, h, labels, rgb, K, means, areas } = data;
  const N = w * h;
  const H0 = CONFIG.ART_HEIGHT, W0 = H0 * w / h;
  const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

  // urutan kedalaman (depan → belakang)
  let order = [...Array(K).keys()];
  const sorters = {
    'light-front': (a, b) => lum(means[b]) - lum(means[a]),
    'dark-front': (a, b) => lum(means[a]) - lum(means[b]),
    'small-front': (a, b) => areas[a] - areas[b],
    'large-front': (a, b) => areas[b] - areas[a]
  };
  order.sort(sorters[CONFIG.DEPTH_ORDER] || sorters['light-front']);

  // posisi atas tiap lapisan per kolom → titik gantung kawat
  const top = new Int32Array(K * w).fill(-1), minX = new Int32Array(K).fill(w), maxX = new Int32Array(K).fill(-1);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const l = labels[y * w + x]; if (l === 255) continue;
    if (top[l * w + x] < 0) top[l * w + x] = y;
    if (x < minX[l]) minX[l] = x; if (x > maxX[l]) maxX[l] = x;
  }

  const group = new THREE.Group(); scene.add(group);
  const layers = [];
  const aniso = renderer.capabilities.getMaxAnisotropy();
  const gap = CONFIG.LAYER_THICKNESS / 2;

  order.forEach((lab, rank) => {
    const z = K === 1 ? 0 : CONFIG.DEPTH / 2 - rank * CONFIG.DEPTH / (K - 1);
    const s = (D - z) / D;                         // ← kompensasi perspektif: inilah kunci anamorfosis
    const Wl = W0 * s, Hl = H0 * s;

    // mask → dilate → blur
    let mask = new Uint8Array(N);
    for (let i = 0; i < N; i++) if (labels[i] === lab) mask[i] = 255;
    mask = dilateMask(mask, w, h, CONFIG.DILATE);
    mask = blurMask(mask, w, h);

    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); const img = ctx.createImageData(w, h);
    for (let i = 0; i < N; i++) {
      const a = mask[i];
      if (CONFIG.FLAT_COLORS) { img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = a; img.data[i * 4 + 3] = 255; }
      else { img.data[i * 4] = rgb[i * 3]; img.data[i * 4 + 1] = rgb[i * 3 + 1]; img.data[i * 4 + 2] = rgb[i * 3 + 2]; img.data[i * 4 + 3] = a; }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = aniso; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.generateMipmaps = true;
    if (!CONFIG.FLAT_COLORS) tex.colorSpace = THREE.SRGBColorSpace;

    const col = new THREE.Color().setRGB(means[lab][0] / 255, means[lab][1] / 255, means[lab][2] / 255, THREE.SRGBColorSpace);
    const mk = (tint) => {
      const m = new THREE.MeshStandardMaterial({
        color: CONFIG.FLAT_COLORS ? col.clone().multiplyScalar(tint) : new THREE.Color(tint, tint, tint),
        roughness: 0.82, metalness: 0, side: THREE.DoubleSide,
        alphaTest: 0.5, alphaToCoverage: true
      });
      m.emissive = (CONFIG.FLAT_COLORS ? col : new THREE.Color(1, 1, 1)).clone().multiplyScalar(0.03 * tint);
      if (CONFIG.FLAT_COLORS) m.alphaMap = tex; else m.map = tex;
      return m;
    };
    const geo = new THREE.PlaneGeometry(Wl, Hl);
    const g = new THREE.Group(); g.position.set(0, CY, z); group.add(g);

    const front = new THREE.Mesh(geo, mk(1)); front.castShadow = CONFIG.SHADOWS; front.receiveShadow = CONFIG.SHADOWS; g.add(front);
    for (let k = 1; k <= 2; k++) {                  // lembar tipis di belakang → kesan ketebalan dari samping
      const e = new THREE.Mesh(geo, mk(0.5)); e.position.z = -gap * k; g.add(e);
    }

    // kawat gantung
    const nW = Math.max(1, CONFIG.WIRES), pos = [], colr = [];
    const px2L = (x, y) => [((x + 0.5) / w - 0.5) * Wl, (0.5 - (y + 0.5) / h) * Hl];
    const used = new Set();
    for (let k = 0; k < nW; k++) {
      const f = nW === 1 ? 0.5 : 0.18 + 0.64 * k / (nW - 1);
      let x = Math.round(minX[lab] + f * (maxX[lab] - minX[lab])), found = -1;
      for (let d = 0; d < w && found < 0; d++) for (const xx of [x + d, x - d]) if (xx >= 0 && xx < w && top[lab * w + xx] >= 0) { found = xx; break; }
      if (found < 0 || used.has(found)) continue; used.add(found);
      const [lx, ly] = px2L(found, top[lab * w + found] + 3);
      pos.push(lx, ly, 0, lx, ly + 24, 0);
      colr.push(0.78, 0.8, 0.88, 0, 0, 0);
      const dot = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), new THREE.MeshStandardMaterial({ color: 0xcfd3dc, metalness: 0.9, roughness: 0.3 }));
      dot.position.set(lx, ly, 0.01); g.add(dot);
    }
    if (pos.length) {
      const lg = new THREE.BufferGeometry();
      lg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      lg.setAttribute('color', new THREE.Float32BufferAttribute(colr, 3));
      g.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));
    }
    layers.push({ g, delay: rank * 0.11 });
  });

  art = { group, layers, aspect: w / h, W0, H0 };
  fitCamera();
  return art;
}

function fitCamera() {
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  const H0 = art ? art.H0 : CONFIG.ART_HEIGHT, W0 = art ? art.W0 : CONFIG.ART_HEIGHT * 0.8;
  const halfV = Math.max(H0 / 2 / 0.72, W0 / 2 / 0.8 / aspect);
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(halfV / D));
  camera.updateProjectionMatrix();
}

/* ───────────── Input: hanya horizontal ───────────── */
let pTar = CONFIG.START_PROGRESS, pCur = CONFIG.START_PROGRESS, touched = false, dragging = false, lastX = 0;
const nudge = dp => { pTar = clamp(pTar + dp * CONFIG.SCROLL_SPEED, 0, 1); touched = true; };
addEventListener('wheel', e => {
  e.preventDefault();
  const m = e.deltaMode === 1 ? 16 : 1;
  nudge((e.deltaX + e.deltaY) * m * 0.00055);
}, { passive: false });
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; renderer.domElement.setPointerCapture(e.pointerId); });
addEventListener('pointermove', e => { if (!dragging) return; nudge(-(e.clientX - lastX) / (innerWidth * 0.85)); lastX = e.clientX; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointercancel', () => dragging = false);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') nudge(0.035);
  else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') nudge(-0.035);
  else if (e.key === 'Home') { pTar = 0; touched = true; }
  else if (e.key === 'End') { pTar = 1; touched = true; }
  else if (e.key === ' ') { pTar = 0.5; touched = true; e.preventDefault(); }
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitCamera(); });

/* seret & lepas gambar baru */
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => { try { disposeArt(); buildArtwork(im); T = 0; $('#msg').style.opacity = 0; } catch (err) { showError(err); } URL.revokeObjectURL(url); };
  im.src = url;
});
function showError(err) {
  console.error(err);
  const m = $('#msg'); m.style.opacity = 1;
  m.textContent = (err && err.name === 'SecurityError')
    ? 'Browser memblokir pembacaan gambar dari file://. Seret & lepas gambar ke jendela ini, atau jalankan lewat server lokal.'
    : 'Gagal memuat gambar: ' + (err && err.message || err);
}

/* ───────────── Loop animasi ───────────── */
const clock = new THREE.Clock();
let T = 0;
const hint = $('#hint'); hint.textContent = CONFIG.HINT_TEXT;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); T += dt;
  pCur += (pTar - pCur) * (1 - Math.exp(-dt * 4.5));

  // progress 0..1 → sudut -MAX..+MAX (melambat di tengah)
  const x = pCur * 2 - 1;
  const ang = Math.sign(x) * Math.pow(Math.abs(x), CONFIG.EASE_POWER) * CONFIG.MAX_ANGLE * Math.PI / 180;
  camera.position.set(Math.sin(ang) * D, CY, Math.cos(ang) * D);
  camera.lookAt(0, CY, 0);

  // efek "terungkap" saat tepat di depan
  const deg = Math.abs(ang) * 180 / Math.PI;
  const reveal = 1 - smooth(0, 7, deg);

  // lampu menyala (sedikit berkedip di awal)
  const on = smooth(0.35, 1.9, T);
  const flick = T < 1.9 ? 0.78 + 0.22 * Math.sin(T * 47) * Math.sin(T * 13 + 1) : 1;
  const level = on * flick;
  spot.intensity = CONFIG.SPOT_INTENSITY * level * (1 + 0.22 * reveal);
  hemi.intensity = 0.5 * (0.35 + 0.65 * on);
  coneMat.uniforms.uIntensity.value = 0.34 * level * (1 + 0.45 * reveal);
  coneMat.uniforms.uTime.value = T;
  dustMat.opacity = 0.55 * level;

  // karya turun dari kawat
  if (art) art.layers.forEach(L => {
    const t = clamp((T - 0.5 - L.delay) / 1.7, 0, 1);
    L.g.position.y = CY + (1 - easeOutCubic(t)) * 7.5;
    L.g.visible = t > 0;
  });

  // debu melayang
  for (let i = 0; i < DUST; i++) {
    const k = i * 3;
    dustPos[k] += dustVel[k] * dt; dustPos[k + 1] += dustVel[k + 1] * dt; dustPos[k + 2] += dustVel[k + 2] * dt;
    dustVel[k] += (Math.random() - .5) * .02 * dt; dustVel[k + 2] += (Math.random() - .5) * .02 * dt;
    const rx = dustPos[k] - spot.position.x, ry = dustPos[k + 1] - spot.position.y, rz = dustPos[k + 2] - spot.position.z;
    const t = rx * spotDir.x + ry * spotDir.y + rz * spotDir.z;
    const px = rx - spotDir.x * t, py = ry - spotDir.y * t, pz = rz - spotDir.z * t;
    if (t < 0.8 || t > coneLen - 1 || Math.hypot(px, py, pz) > t * tanA * 0.95) spawnDust(i);
  }
  dustGeo.attributes.position.needsUpdate = true;

  // petunjuk
  if (CONFIG.SHOW_HINT) hint.classList.toggle('on', T > 3.2 && !touched);
  renderer.render(scene, camera);
}

/* ───────────── Mulai ───────────── */
function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => rej(new Error('File gambar tidak ditemukan: ' + src)); im.src = src; });
}
(async () => {
  try {
    const src = CONFIG.IMAGE_SRC ? await loadImage(CONFIG.IMAGE_SRC) : makeDemoArt();
    buildArtwork(src);
    $('#msg').style.opacity = 0;
    $('#fade').style.opacity = 0;
  } catch (err) { showError(err); $('#fade').style.opacity = 0; }
  window.__anamorfosis = { setProgress: v => { pTar = pCur = v; touched = true; }, skipIntro: () => { T = 6; } };
  frame();
})();
</script>
