const M=16, N=M*2, H=4.2, W=H*0.5625;
const w=W/(M*Math.SQRT2), d=w;

const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(28,1,0.1,100);
scene.add(new THREE.AmbientLight(0xffffff,0.8));
const key=new THREE.DirectionalLight(0xffffff,0.55);key.position.set(2,4,8);scene.add(key);

const loader=new THREE.TextureLoader();
function tex(src){const t=loader.load(src);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}

function build(parity,src){
  const pos=[],uv=[],idx=[];let n=0;
  for(let k=parity;k<N;k+=2){
    const x0=k*w-N*w/2, x1=x0+w;
    const even=k%2===0, z0=even?0:d, z1=even?d:0, zo=-d/2;
    const j=Math.floor(k/2), u0=j/M, u1=(j+1)/M;
    pos.push(x0,-H/2,z0+zo, x1,-H/2,z1+zo, x1,H/2,z1+zo, x0,H/2,z0+zo);
    uv.push(u0,0,u1,0,u1,1,u0,1);
    idx.push(n,n+1,n+2,n,n+2,n+3);n+=4;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  const grp=new THREE.Group();
  grp.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:tex(src)})));
  grp.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0xf1ece2,side:THREE.BackSide})));
  return grp;
}
const model=new THREE.Group();
model.add(build(0,IMG_A));   // sisi kiri
model.add(build(1,IMG_B));   // sisi kanan
scene.add(model);

function resize(){
  const vw=innerWidth,vh=innerHeight,asp=vw/vh;
  renderer.setSize(vw,vh,false);
  camera.aspect=asp;
  const tn=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const dist=Math.max((H*1.25/2)/tn,(N*w*1.15/2)/(tn*asp));
  camera.position.set(0,0,dist);camera.updateProjectionMatrix();
  const max=document.documentElement.scrollWidth-innerWidth;
  if(!resize.done&&max>0){scrollTo(max/2,0);resize.done=true;}
}
addEventListener('resize',resize);
addEventListener('load',()=>{resize.done=false;resize();});

addEventListener('wheel',e=>{e.preventDefault();scrollBy(e.deltaX+e.deltaY,0);},{passive:false});

let cur=0;
function target(){
  const max=Math.max(1,document.documentElement.scrollWidth-innerWidth);
  const t=Math.min(1,Math.max(0,scrollX/max));
  return (0.5-t)*Math.PI; // +90° (kiri) … -90° (kanan)
}
resize();
(function loop(){
  cur+=(target()-cur)*0.12;
  model.rotation.y=cur;
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
})();
</script>
